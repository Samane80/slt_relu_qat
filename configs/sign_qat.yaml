# =====================================================================
# PHASE 2 -- QAT fine-tuning on PHOENIX-2014T
# =====================================================================

data:
  data_path: ./data/phoenix14t
  version: phoenix_2014_trans
  train: phoenix14t.pami0.train
  dev: phoenix14t.pami0.dev
  test: phoenix14t.pami0.test
  feature_size: 1024
  level: word
  txt_lowercase: true
  max_sent_length: 400

model:
  quantize: true
  initializer: xavier
  bias_initializer: zeros
  init_gain: 1.0
  embed_initializer: xavier
  embed_init_gain: 1.0
  tied_softmax: false

  encoder:
    type: transformer
    attention_type: reluformer
    num_layers: 3
    num_heads: 8
    hidden_size: 512
    ff_size: 2048
    dropout: 0.15
    embeddings:
      embedding_dim: 512
      norm_type: layer
      activation_type: gelu
      scale: false
      dropout: 0.15

  decoder:
    type: transformer
    attention_type: softmax
    num_layers: 3
    num_heads: 8
    hidden_size: 512
    ff_size: 2048
    dropout: 0.15
    embeddings:
      embedding_dim: 512
      norm_type: layer
      activation_type: gelu
      scale: false
      dropout: 0.15

training:
  model_dir: models/phoenix14t_qat
  overwrite: false
  load_model: models/phoenix14t_float/best.ckpt
  reset_optimizer: true
  reset_scheduler: true
  reset_best_ckpt: true

  random_seed: 42
  use_cuda: true

  epochs: 20
  batch_size: 32
  batch_type: sentence
  eval_batch_size: 32
  eval_batch_type: sentence
  batch_multiplier: 1
  shuffle: true

  optimizer: adam
  learning_rate: 0.00005
  betas: [0.9, 0.998]
  weight_decay: 0.003
  clip_grad_norm: 1.0
  scheduling: plateau
  patience: 4
  decrease_factor: 0.7
  learning_rate_min: 0.0000001

  recognition_loss_weight: 5.0
  translation_loss_weight: 1.0
  label_smoothing: 0.1
  attn_reg_loss_weight: 0.05

  eval_metric: bleu
  early_stopping_metric: eval_metric
  eval_recognition_beam_size: 1
  eval_translation_beam_size: 1
  eval_translation_beam_alpha: -1
  translation_max_output_length: 60

  validation_freq: 100
  logging_freq: 100
  keep_last_ckpts: 5
