# =====================================================================
# PHASE 2 -- QAT fine-tuning on PHOENIX-2014T
# =====================================================================
# Run ONLY after Phase 1 (phoenix14t_float.yaml) has finished/converged.
# Run with:  python -m signjoey train configs/phoenix14t_qat.yaml
#
# Everything below is IDENTICAL to the float config except the block
# marked "CHANGED FOR PHASE 2" -- same data, same architecture, same
# regularization, so the checkpoint loads cleanly (strict=True, no key
# mismatch -- verified in our test_fp32_to_qat_pipeline.py run).
# =====================================================================

data:
  data_path: ./data/phoenix14t
  version: phoenix_2014_trans
  train: phoenix14t.pami0.train
  dev: phoenix14t.pami0.dev
  test: phoenix14t.pami0.test
  feature_size: 1024
  level: word
  txt_lowercase: true
  max_sent_length: 400

model:
  quantize: true              # <-- CHANGED FOR PHASE 2: same architecture,
                               #     every layer now runs real fake-quant
  initializer: xavier
  bias_initializer: zeros
  init_gain: 1.0
  embed_initializer: xavier
  embed_init_gain: 1.0
  tied_softmax: false

  encoder:
    type: transformer
    attention_type: reluformer
    num_layers: 3
    num_heads: 8
    hidden_size: 512
    ff_size: 2048
    dropout: 0.1
    embeddings:
      embedding_dim: 512
      norm_type: batch
      activation_type: softsign
      scale: false
      dropout: 0.1

  decoder:
    type: transformer
    attention_type: softmax
    num_layers: 3
    num_heads: 8
    hidden_size: 512
    ff_size: 2048
    dropout: 0.1
    embeddings:
      embedding_dim: 512
      norm_type: batch
      activation_type: softsign
      scale: false
      dropout: 0.1

training:
  model_dir: /content/drive/MyDrive/slt_project/relu_output_qat          # CHANGED FOR PHASE 2: a new dir
  overwrite: false
  load_model: /content/drive/MyDrive/slt_project/relu_output1/best.ckpt   # CHANGED FOR PHASE 2:
                                                     # start from the
                                                     # FP32-pretrained weights
  reset_optimizer: true       # CHANGED FOR PHASE 2: fresh optimizer state --
                               # the FP32 Adam momentum isn't meaningful for
                               # the very different QAT/STE gradients
  reset_scheduler: true
  reset_best_ckpt: true       # start early-stopping/best-score tracking
                               # fresh for this phase (BLEU will likely dip
                               # right after the switch, then recover)

  random_seed: 42
  use_cuda: true

  epochs: 20                  # QAT fine-tuning needs far fewer epochs than
                               # the original pretraining -- start here,
                               # extend if BLEU is still improving
  batch_size: 32
  batch_type: sentence
  eval_batch_size: 32
  eval_batch_type: sentence
  batch_multiplier: 1
  shuffle: true

  optimizer: adam
  learning_rate: 0.00005      # CHANGED FOR PHASE 2: much smaller than the
                               # FP32 LR -- QAT is fine-tuning, not training
                               # from scratch
  weight_decay: 0.0
  clip_grad_norm: 1.0
  scheduling: plateau
  patience: 4
  decrease_factor: 0.5
  learning_rate_min: 0.00000001

  recognition_loss_weight: 1.0
  translation_loss_weight: 1.0
  label_smoothing: 0.1

  attn_reg_loss_weight: 0.05

  eval_metric: bleu
  early_stopping_metric: eval_metric
  eval_recognition_beam_size: 1
  eval_translation_beam_size: 1
  eval_translation_beam_alpha: -1
  translation_max_output_length: 60

  validation_freq: 300        # a bit more frequent than Phase 1 -- QAT
                               # fine-tuning is shorter, and you want good
                               # visibility into whether BLEU is recovering
  logging_freq: 100
  keep_last_ckpts: 5
